<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Painel Cozinha — Bigfield</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body{
      font-family:"Poppins",sans-serif;
      background:#f6f7f9;
      color:#111;
      padding:16px;
    }
    .wrap{
      max-width:1100px;
      margin:0 auto;
    }
    h1{ margin-bottom:14px; }

    .controls{ display:flex; gap:10px; margin-bottom:14px; align-items:center; }
    .filters{ display:flex; gap:10px; align-items:center; }

    .btn{
      padding:8px 12px;
      border-radius:8px;
      border:none;
      cursor:pointer;
      font-weight:600;
    }
    .btn.primary{ background:#111; color:#fff; }
    .btn.ghost{ background:#fff; border:1px solid #ccc; }

    .orders{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
      gap:12px;
    }

    .order{
      background:#fff;
      border-radius:10px;
      padding:14px;
      box-shadow:0 8px 20px rgba(0,0,0,.05);
    }

    .order h3{ margin-bottom:6px; font-size:1.05rem; }
    .meta{ color:#666; font-size:.9rem; margin-bottom:8px; }
    .items{ margin-bottom:8px; }
    .items li{ margin-bottom:4px; }

    .badge{ display:inline-block; padding:6px 10px; border-radius:999px; font-weight:700; font-size:.8rem; }
    .badge.new{ background:#ffcb05; color:#111; }
    .badge.prep{ background:#ffe6b4; color:#111; }
    .badge.done{ background:#e0e0e0; color:#333; }

    .small{ font-size:.88rem; color:#555; }
    .timestamp{ font-size:.78rem; color:#888; margin-top:6px; }

    .order-footer{
      display:flex;
      gap:8px;
      justify-content:flex-end;
      flex-wrap:wrap;
      margin-top:10px;
    }

    .empty{
      color:#777; padding:30px; border:2px dashed #eee; border-radius:10px; text-align:center;
    }

    /* Destaque visual para pedido novo */
    @keyframes flash {
      0% { background:#fff; }
      50% { background:#ffeb94; }
      100% { background:#fff; }
    }
  </style>
</head>
<body>

  <div class="wrap">
    <h1>Painel da Cozinha — Bigfield 🍕</h1>

    <div class="controls">

      <div class="filters">
        <label><input type="radio" name="filter" value="all" checked> Todos</label>
        <label><input type="radio" name="filter" value="new"> Novos</label>
        <label><input type="radio" name="filter" value="in_progress"> Em preparo</label>
        <label><input type="radio" name="filter" value="done"> Finalizados</label>
      </div>

      <div style="margin-left:auto; display:flex; gap:10px;">
        <button id="btn-refresh" class="btn ghost">Atualizar</button>
        <button id="btn-clear-done" class="btn">Limpar finalizados</button>
      </div>

    </div>

    <div id="orders-root" class="orders"></div>
    <div id="empty" class="empty" style="display:none;">Nenhum pedido por aqui 🍽️</div>

  </div>

  <script src="kitchen.js"></script>
</body>
</html>
